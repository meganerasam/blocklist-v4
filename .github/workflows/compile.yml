name: Compile — assemble dist/

# One compile = ASSEMBLY of the sanitized sources (curation re-conception 2026-09-08:
# every per-source subtraction happens in build/curate/curate.php → sanitized/; Sheet C
# is product-only — published as whitelist/default.json, never merged). Compile reads
# sanitized/ lanes + the curation set, applies the veto and never-block floor guards, appends
# D + manual-blocklist + fleet-BL (above curation), band re-ID, DNR budget assertions, manifest.json.
# dist/ is published as commits (user decision 2026-09-07); the fleet fetches it through
# the backend mirrors, never from GitHub directly.
# Fail-closed: any gate/assertion failure exits non-zero BEFORE dist/ is touched, so the
# previous dist/ keeps being served. The change-budget gate (>30% rule delta or >20%
# shipped-domain drop) holds publishes for a confirming re-run with force=true.
# Runs daily at 07:00 UTC — after verify (00:30), the fleet pull (06:00) and its curate —
# and after every successful curate so sheet edits ship the same half-day.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_run:
    workflows: ["Curate — sanitize sources"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Override the change-budget gate (the confirming re-run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: compile
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_run fires on failed curates too — never compile from a red curation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Compile dist/
        env:
          COMPILE_FORCE: ${{ inputs.force == true && '1' || '' }}
        run: php build/compile/compile.php

      - name: Assert DNR budgets (≤30,000 rules · ≤5,000 redirect/modifyHeaders)
        run: |
          total=$(jq '.counts.network_rules_total' dist/manifest.json)
          unsafe=$(jq '.counts.unsafe_rules' dist/manifest.json)
          echo "rules: $total / 30000 · redirect+modifyHeaders: $unsafe / 5000"
          [ "$total" -le 30000 ] || { echo "::error::DNR budget: $total rules > 30000"; exit 1; }
          [ "$unsafe" -le 5000 ] || { echo "::error::DNR budget: $unsafe redirect/modifyHeaders > 5000"; exit 1; }
          grep -q '__EXT_ID__' dist/network/rules.json || { echo "::error::__EXT_ID__ placeholder missing from rules.json — substitution is client-side"; exit 1; }

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ state/review/
          if git diff --cached --quiet; then
            echo "No dist changes."
          else
            git commit -m "compile: publish dist $(date -u '+%Y-%m-%d %H:%M')"
            # ingest/verify/extension may have pushed since checkout — rebase once and retry
            git push || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push; }
          fi

      # The à-la-carte layer (user decision 2026-09-10): per-source domains + per-type DNR
      # rules at three stages (raw/curated/merged) under dist/catalog/. Pure output layer —
      # reads sources/ + sanitized/ + dist/, writes only dist/catalog/, own index+prune.
      # Runs AFTER the canonical dist commit (adversarial review 2026-09-10): a
      # catalog-only failure turns the run red but never withholds the fleet-serving
      # artifacts; its separate commit keeps a torn catalog tree out of the repo, and the
      # manifest.sanitized_provenance gate detects the stale-catalog window on the next run.
      - name: Catalog — dist/catalog/ (raw · curated · merged)
        run: php build/catalog/catalog.php

      - name: Commit catalog
        run: |
          git add dist/catalog
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "catalog: publish dist/catalog $(date -u '+%Y-%m-%d %H:%M')"
            git push || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push; }
          fi
