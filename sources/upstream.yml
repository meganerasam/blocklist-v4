# Every external input of the factory, in one reviewable file.
# ingest.yml reads this. KNOWN GAP: build/ingest/fetch_extension_whitelists.php still
# hardcodes the 4 backend endpoints below instead of reading extension_endpoints from here.
# (The 59 EasyList URLs migrated here 2026-09-07; the category generators read ONLY the
#  sources/easylist/ snapshots — zero live URLs — and run inside build/curate/curate.php.)

# SHEET ACCESS (decide before ingest.yml is written):
#   The /export?format=csv URLs below only work unauthenticated if a sheet is shared as
#   "Anyone with the link - Viewer" (a restricted sheet returns a Google login HTML page —
#   the blocklist-prev.csv failure mode). To keep sheets fully restricted (recommended):
#   share each sheet with a GCP service account (Viewer), key in Actions secret GSHEET_SA_KEY,
#   and ingest calls the Sheets API v4 with a Bearer token using the same spreadsheet IDs —
#   it returns JSON rows directly. Sheet B click counts never leave the sheet — the
#   ingest split (sources/traffic_quality/, published as dist/traffic_quality/) is domains only.
sheets:
  A_popup:
    name: popup
    mirror: sources/gsheet/popup.json
    # KEPT in its current pivot format ("Block List v3" column) — the fetcher parses it as-is
    export_url: "https://docs.google.com/spreadsheets/d/18Q86cyLgrDXrPCI3NrFlJTiLwU4JQ3QCFYRVR1_WDpc/export?format=csv&gid=1932785084"
  B_trackers:
    name: traffic-quality-trackers
    mirror: sources/traffic_quality # DIRECTORY — split per market at ingest: global.json, fr.json, us.json, …
    export_url: "https://docs.google.com/spreadsheets/d/1QQEymysUlufJ12oTbr1ILdpZy8PdO-OHSTyxnkdhDSQ/export?format=csv&gid=1704568972"
  C_default_whitelist:
    name: default-whitelist
    mirror: sources/gsheet/default-whitelist.json
    export_url: "https://docs.google.com/spreadsheets/d/1io0IqiXUc8VBERQvdWuUkh4pwJz6sxxZ7QqGL8i7YTk/export?format=csv&gid=0#gid=0" # bootstrapped: the 174 default_excluded_domains() from ninja-adb21.php
  D_default_blocklist:
    name: default-blocklist
    mirror: sources/gsheet/default-blocklist.json
    export_url: "https://docs.google.com/spreadsheets/d/1io0IqiXUc8VBERQvdWuUkh4pwJz6sxxZ7QqGL8i7YTk/export?format=csv&gid=735128469#gid=735128469" # NEW — org default block domains, appended as block rules; bootstrap candidate: the 23 default_blockdom() entries
  E_default_blocklist_not_to_add:
    name: default-blocklist-not-to-add
    mirror: sources/gsheet/default-blocklist-not-to-add.json
    export_url: "https://docs.google.com/spreadsheets/d/1io0IqiXUc8VBERQvdWuUkh4pwJz6sxxZ7QqGL8i7YTk/export?format=csv&gid=866107718#gid=866107718" # tab "blocklist_but_do_not_add" — live 2026-09-10 (21 rows)
    note: |
      NEW 2026-09-10 (user decision). The veto on the default blocklist: a domain listed
      here must produce NO rule at all. Same contract as I_omit_from_blocklist — curation-set
      member AND append floor — but a separate, freely editable list, whereas
      omit-from-blocklist stays locked down for our own brand domains.
      Matched domain + ALL subdomains. Sheet D itself is unchanged.
  F_manual_whitelist:
    name: manual-whitelist
    mirror: sources/gsheet/manual-whitelist.json
    export_url: "https://docs.google.com/spreadsheets/d/1hPdvfQBkXWTb8dU0w_x0XA1NJBylADfd20MP5PCNOjw/export?format=csv&gid=0#gid=0" # starts empty — future manual whitelist additions
  G_manual_blocklist:
    name: manual-blocklist
    mirror: sources/gsheet/manual-blocklist.json
    export_url: "https://docs.google.com/spreadsheets/d/1hPdvfQBkXWTb8dU0w_x0XA1NJBylADfd20MP5PCNOjw/export?format=csv&gid=1649415842#gid=1649415842" # starts empty
  H_omit_from_whitelist:
    name: omit-from-whitelist
    mirror: sources/gsheet/omit-from-whitelist.json
    export_url: "https://docs.google.com/spreadsheets/d/1IS72yj64N7RVIT_kXOmE-67Q0dg1hqXgzY9Y6oSyA-0/export?format=csv&gid=1360553846#gid=1360553846" # holds the protected search hosts (google.com, search.yahoo.com, …)
  I_omit_from_blocklist:
    name: omit-from-blocklist
    mirror: sources/gsheet/omit-from-blocklist.json
    export_url: "https://docs.google.com/spreadsheets/d/1IS72yj64N7RVIT_kXOmE-67Q0dg1hqXgzY9Y6oSyA-0/export?format=csv&gid=0#gid=0" # bootstrapped 2026-09-07 with whitelistes3.txt's 13 ecosystem/partner domains
    note: never-block floor — tightest edit access of all sheets
  J_download_sites:
    name: download-sites
    mirror: sources/gsheet/download-sites.json
    export_url: "https://docs.google.com/spreadsheets/d/1IS72yj64N7RVIT_kXOmE-67Q0dg1hqXgzY9Y6oSyA-0/export?format=csv&gid=43296086#gid=43296086" # NEW 2026-09-08 — download sites, omit-style domain list; curation input: subtracted from the blocking sources (Sheet A, KADhosts, hosts lanes, easylist family)

  # ---- standalone sheets (K–O): mirrored + published as on-demand JSON, NEVER merged ----
  # These carry the remaining hardcoded arrays out of ninja-adb21.php; the backends fetch
  # them on demand (like Sheet B). Bootstrap TSVs generated from the live server file.
  K_whitelisted_domains_injection_enabled:
    name: whitelisted-domains-injection-enabled
    mirror: sources/gsheet/whitelisted-domains-injection-enabled.json
    export_url: "https://docs.google.com/spreadsheets/d/1eVY_rEJ9fNZVwQTPns6isM4bv5ggLmpkEcQ-VzBqF5M/export?format=csv&gid=0#gid=0" # was $whitelistedDomainsInjectionEnabled (344 entries)
  L_tracking_whitelist:
    name: tracking-whitelist
    mirror: sources/gsheet/tracking-whitelist.json
    export_url: "https://docs.google.com/spreadsheets/d/1eVY_rEJ9fNZVwQTPns6isM4bv5ggLmpkEcQ-VzBqF5M/export?format=csv&gid=331010199#gid=331010199" # was $tracking_whitelist (46 entries, DNR rule 5005)
  M_allow_request_domains:
    name: allow-request-domains
    mirror: sources/gsheet/allow-request-domains.json
    export_url: "https://docs.google.com/spreadsheets/d/1eVY_rEJ9fNZVwQTPns6isM4bv5ggLmpkEcQ-VzBqF5M/export?format=csv&gid=110294896#gid=110294896" # was $allowReqDomains (19 entries, DNR rule 5006)
  N_initiator_allowed_domains:
    name: initiator-allowed-domains
    mirror: sources/gsheet/initiator-allowed-domains.json
    export_url: "https://docs.google.com/spreadsheets/d/1eVY_rEJ9fNZVwQTPns6isM4bv5ggLmpkEcQ-VzBqF5M/export?format=csv&gid=920400328#gid=920400328" # was $initiatorAllowedDomains (316 entries, DNR rule 5006)
  O_rule101xtra:
    name: rule101xtra
    mirror: sources/gsheet/rule101xtra.json
    export_url: "https://docs.google.com/spreadsheets/d/1eVY_rEJ9fNZVwQTPns6isM4bv5ggLmpkEcQ-VzBqF5M/export?format=csv&gid=2001657757#gid=2001657757" # was $rule101xtraDomainsNew (307 entries, CSP-strip rule 33)

hosts:
  # measured 2026-09-07 vs the EasyList-side covered set (129,955 domains):
  # dropped: Firebog Easylist (99.6% duplicate) and Firebog Admiral (92.4% duplicate)
  anudeep:
    url: "https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt"
    snapshot: sources/hosts/anudeep.txt
    role: domains # curated at curate → sanitized/hosts/anudeep.txt → the domains lane of rules.json
  peterlowe:
    url: "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"
    snapshot: sources/hosts/peterlowe.txt
    role: domains # curated at curate → sanitized/hosts/peterlowe.txt → the domains lane of rules.json
  adguarddns:
    url: "https://v.firebog.net/hosts/AdguardDNS.txt"
    snapshot: sources/hosts/adguarddns.txt
    role: domains # biggest unique contributor (97.7k uncovered) → sanitized/hosts/adguarddns.txt → the domains lane
  kadhosts:
    url: "https://raw.githubusercontent.com/StevenBlack/hosts/refs/heads/master/data/KADhosts/hosts"
    snapshot: sources/hosts/kadhosts.txt
    role: popup # scam/fraud class (1% EasyList overlap) → sanitized/hosts/kadhosts.txt → the popup (redirect) lane

